<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="372" viewBox="0 0 1200 372" role="img" aria-labelledby="title desc">
  <title id="title">Keelab systems lab</title>
  <desc id="desc">A navigation console for Keelab open-source systems.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07131d"/><stop offset=".55" stop-color="#0b1724"/><stop offset="1" stop-color="#171526"/></linearGradient>
    <radialGradient id="core"><stop offset="0" stop-color="#ffe0a3"/><stop offset=".2" stop-color="#54e0d4"/><stop offset=".62" stop-color="#a78bfa"/><stop offset="1" stop-color="#0b1724" stop-opacity="0"/></radialGradient>
    <linearGradient id="beam"><stop stop-color="#54e0d4" stop-opacity="0"/><stop offset=".5" stop-color="#54e0d4" stop-opacity=".78"/><stop offset="1" stop-color="#54e0d4" stop-opacity="0"/></linearGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#54e0d4" stroke-opacity=".08"/></pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .mono{font-family:"IBM Plex Mono","DM Mono","SFMono-Regular",Consolas,monospace}
      .orbit{transform-origin:258px 185px;animation:spin 18s linear infinite}
      .orbit2{transform-origin:258px 185px;animation:spin 27s linear infinite reverse}
      .float{animation:float 5s ease-in-out infinite}.pulse{animation:pulse 2.8s ease-in-out infinite}
      .blink{animation:blink 1.1s steps(2,start) infinite}.scan{animation:scan 5s ease-in-out infinite}
      @keyframes spin{to{transform:rotate(360deg)}}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
      @keyframes pulse{0%,100%{opacity:.45;transform:scale(1)}50%{opacity:1;transform:scale(1.08)}}
      @keyframes blink{50%{opacity:.16}}@keyframes scan{0%,100%{transform:translateX(-220px);opacity:0}18%,70%{opacity:1}92%{transform:translateX(690px);opacity:0}}
      @media(prefers-reduced-motion:reduce){*{animation:none!important}}
    </style>
  </defs>
  <rect width="1200" height="372" rx="30" fill="url(#bg)"/><rect width="1200" height="372" rx="30" fill="url(#grid)"/>
  <circle cx="1045" cy="34" r="180" fill="#ff806e" opacity=".08"/><circle cx="1090" cy="372" r="230" fill="#54e0d4" opacity=".07"/>
  <path d="M28 318C190 252 344 360 518 278S870 210 1172 284" fill="none" stroke="#ffe0a3" stroke-opacity=".25" stroke-width="2"/>
  <g class="float" filter="url(#glow)">
    <circle cx="258" cy="185" r="88" fill="url(#core)" opacity=".8"/>
    <g>
      <path d="M258 101v128" stroke="#ffe0a3" stroke-width="4" stroke-linecap="round"/>
      <path d="M255 116l-43 76h46z" fill="#54e0d4" fill-opacity=".2" stroke="#54e0d4" stroke-width="2"/>
      <path d="M261 130l35 62h-38z" fill="#a78bfa" fill-opacity=".22" stroke="#a78bfa" stroke-width="2"/>
      <path d="M204 207q54 34 108 0-14 39-54 49-40-10-54-49z" fill="#0b1724" fill-opacity=".92" stroke="#54e0d4" stroke-width="2"/>
      <path d="M218 220q40 18 80 0" fill="none" stroke="#ffe0a3" stroke-opacity=".75" stroke-width="2"/>
      <circle cx="258" cy="191" r="10" fill="#ffe0a3"/>
      <path d="M220 191h76" stroke="#54e0d4" stroke-opacity=".7" stroke-width="1.5"/>
    </g>
    <circle cx="258" cy="185" r="13" fill="#ffe0a3" class="pulse"/>
  </g>
  <g fill="none" stroke="#54e0d4" stroke-opacity=".58"><ellipse cx="258" cy="185" rx="142" ry="60" stroke-width="1.4"/><ellipse cx="258" cy="185" rx="164" ry="84" stroke-width="1" transform="rotate(-24 258 185)"/><ellipse cx="258" cy="185" rx="182" ry="103" stroke-width="1" transform="rotate(24 258 185)"/></g>
  <g class="orbit"><circle cx="400" cy="185" r="8" fill="#54e0d4"/><circle cx="116" cy="185" r="4" fill="#ffe0a3"/></g>
  <g class="orbit2"><circle cx="258" cy="82" r="5" fill="#ff806e"/><circle cx="258" cy="288" r="6" fill="#a78bfa"/></g>
  <g class="mono" transform="translate(58 48)" opacity=".94"><rect width="354" height="78" rx="15" fill="#0b1724" stroke="#2b4452"/><circle cx="27" cy="25" r="5" fill="#ff806e"/><circle cx="45" cy="25" r="5" fill="#ffe0a3"/><circle cx="63" cy="25" r="5" fill="#54e0d4"/><text x="25" y="58" fill="#91a7b3" font-size="14">$ keelith new hello</text><rect x="256" y="44" width="9" height="17" fill="#54e0d4" class="blink"/></g>
  <text class="mono" x="72" y="334" fill="#54e0d4" font-size="13" font-weight="700">KEELAB / SYSTEMS LAB</text><text class="mono" x="286" y="334" fill="#91a7b3" font-size="13">boundaries in motion</text>
  <g transform="translate(510 62)">
    <text class="mono" x="0" y="0" fill="#91a7b3" font-size="17" letter-spacing="3">PROFILE://KEELAB</text>
    <text class="mono" x="0" y="68" fill="#ffffff" font-size="66" font-weight="800">keelab</text>
    <rect x="0" y="90" width="610" height="2" fill="url(#beam)" class="scan"/>
    <text class="mono" x="0" y="132" fill="#54e0d4" font-size="24" font-weight="700">systems with a steady keel</text>
    <text class="mono" x="0" y="174" fill="#d5e0e5" font-size="18">runtime · mesh · release control</text>
    <text class="mono" x="0" y="205" fill="#d5e0e5" font-size="18">open building blocks for observable systems</text>
    <g transform="translate(0 237)">
      <rect width="130" height="36" rx="18" fill="#54e0d4" fill-opacity=".13" stroke="#54e0d4" stroke-opacity=".62"/><rect x="148" width="124" height="36" rx="18" fill="#ffe0a3" fill-opacity=".12" stroke="#ffe0a3" stroke-opacity=".62"/><rect x="290" width="152" height="36" rx="18" fill="#ff806e" fill-opacity=".12" stroke="#ff806e" stroke-opacity=".65"/>
      <text class="mono" x="23" y="24" fill="#54e0d4" font-size="14" font-weight="700">Runtime</text><text class="mono" x="173" y="24" fill="#ffe0a3" font-size="14" font-weight="700">Mesh</text><text class="mono" x="315" y="24" fill="#ff806e" font-size="14" font-weight="700">Release</text>
    </g>
  </g>
</svg>
