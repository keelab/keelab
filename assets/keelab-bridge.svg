<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="292" viewBox="0 0 1200 292" role="img" aria-labelledby="title desc">
  <title id="title">Keelab project bridge</title><desc id="desc">The Keelab path from building a runtime to connecting agents and governing releases.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1724"/><stop offset=".58" stop-color="#111c2b"/><stop offset="1" stop-color="#1a1525"/></linearGradient>
    <linearGradient id="rail"><stop stop-color="#54e0d4"/><stop offset=".5" stop-color="#ffe0a3"/><stop offset="1" stop-color="#ff806e"/></linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#54e0d4" opacity=".15"/></pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>.mono{font-family:"IBM Plex Mono","DM Mono","SFMono-Regular",Consolas,monospace}.p{animation:pulse 2.8s ease-in-out infinite}.p2{animation:pulse 2.8s ease-in-out .35s infinite}.p3{animation:pulse 2.8s ease-in-out .7s infinite}.p4{animation:pulse 2.8s ease-in-out 1.05s infinite}.scan{animation:scan 5s ease-in-out infinite}.cursor{animation:blink 1s steps(2,start) infinite}@keyframes pulse{0%,100%{opacity:.74}50%{opacity:1}}@keyframes blink{50%{opacity:.16}}@keyframes scan{0%,100%{transform:translateX(-380px);opacity:0}18%,72%{opacity:.8}93%{transform:translateX(1180px);opacity:0}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style>
  </defs>
  <rect x="14" y="10" width="1172" height="272" rx="23" fill="url(#panel)"/><rect x="14" y="10" width="1172" height="272" rx="23" fill="url(#dots)"/>
  <rect x="42" y="45" width="380" height="2" fill="url(#rail)" class="scan"/><circle cx="80" cy="73" r="5" fill="#ff806e"/><circle cx="98" cy="73" r="5" fill="#ffe0a3"/><circle cx="116" cy="73" r="5" fill="#54e0d4"/>
  <text class="mono" x="80" y="114" fill="#9fb4bf" font-size="15">$ keelab route --observe all</text><rect x="405" y="99" width="9" height="18" fill="#54e0d4" class="cursor"/>
  <g class="p"><rect x="60" y="145" width="250" height="78" rx="15" fill="#0b1a22" stroke="#54e0d4" stroke-opacity=".64"/><text class="mono" x="84" y="178" fill="#54e0d4" font-size="15" font-weight="800">BUILD</text><text class="mono" x="84" y="201" fill="#d5e0e5" font-size="13">keelith · runtime</text></g>
  <g class="p2"><rect x="340" y="145" width="250" height="78" rx="15" fill="#1d1b10" stroke="#ffe0a3" stroke-opacity=".66"/><text class="mono" x="364" y="178" fill="#ffe0a3" font-size="15" font-weight="800">CONNECT</text><text class="mono" x="364" y="201" fill="#d5e0e5" font-size="13">keelmesh · agents</text></g>
  <g class="p3"><rect x="620" y="145" width="250" height="78" rx="15" fill="#17152a" stroke="#a78bfa" stroke-opacity=".7"/><text class="mono" x="644" y="178" fill="#a78bfa" font-size="15" font-weight="800">EXTEND</text><text class="mono" x="644" y="201" fill="#d5e0e5" font-size="13">contrib · x · operator</text></g>
  <g class="p4"><rect x="900" y="145" width="250" height="78" rx="15" fill="#21131a" stroke="#ff806e" stroke-opacity=".7"/><text class="mono" x="924" y="178" fill="#ff806e" font-size="15" font-weight="800">CONTROL</text><text class="mono" x="924" y="201" fill="#d5e0e5" font-size="13">keelway · releases</text></g>
  <g fill="none" stroke="url(#rail)" stroke-width="2" opacity=".6" filter="url(#glow)"><path d="M310 184h30"/><path d="M590 184h30"/><path d="M870 184h30"/></g>
  <text class="mono" x="80" y="257" fill="#54e0d4" font-size="13" font-weight="800">signal:</text><text class="mono" x="145" y="257" fill="#d5e0e5" font-size="13">ordinary code</text><text class="mono" x="340" y="257" fill="#ffe0a3" font-size="13">explicit interfaces</text><text class="mono" x="620" y="257" fill="#a78bfa" font-size="13">observable execution</text><text class="mono" x="930" y="257" fill="#ff806e" font-size="13">controlled change</text>
</svg>
